<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root{--bg:#f6f8fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--primary:#2563eb;--border:#d1d5db;}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);margin:0;padding:24px;color:var(--text)}
  .wrap{max-width:1100px;margin:0 auto}
  h1{margin:0 0 8px;font-size:28px}
  .sub{color:var(--muted);margin-bottom:18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .section{margin-bottom:16px}
  .section h2{font-size:18px;margin:0 0 10px}
  .section h3{font-size:15px;margin:10px 0 8px;color:#111827}
  .options{display:grid;gap:8px}
  button.opt{width:100%;text-align:left;border:1px solid var(--border);background:#fff;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px}
  button.opt:hover{border-color:var(--primary)}
  button.opt.selected{background:#eff6ff;border-color:var(--primary)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=number]{padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;width:160px}
  .scorebox{padding:14px;border-radius:12px;background:#f9fafb;border:1px dashed var(--border)}
  .sticky{position:sticky;top:12px;z-index:5}
  .total{font-size:30px;font-weight:700;color:var(--primary)}
  .label{color:var(--muted);font-size:13px}
  .small{font-size:12px;color:var(--muted);margin-top:6px}
  .footer{margin-top:12px;font-size:12px;color:var(--muted)}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>SPPB scoring v11</h1>
  <div class="sub"></div>
  <div class="grid">
    <div class="card">
      <div class="section">
        <h2>Gait Speed Test</h2>
        <div class="row">
          <label for="gaitTime">4 meter walk time (seconds)</label>
          <input id="gaitTime" type="number" min="0" step="0.01" placeholder="e.g. 5.8">
        </div>
        <div class="small" id="gaitScoreText">Score: 0</div>
      </div>
      <div class="section">
        <h2>Chair Stand Test</h2>
        <div class="row">
          <label for="chairTime">5x chair stand time (seconds)</label>
          <input id="chairTime" type="number" min="0" step="0.01" placeholder="e.g. 12.4">
        </div>
        <div class="small" id="chairScoreText">Score: 0</div>
      </div>
      <div class="section">
        <h2>Balance Test</h2>
        <h3>Side by side standing</h3>
        <div class="options" id="sideGroup"></div>
        <div class="small" id="sideScoreText">Score: 0</div>
        <h3>Semi tandem stand</h3>
        <div class="options" id="semiGroup"></div>
        <div class="small" id="semiScoreText">Score: 0</div>
        <h3>Tandem stand</h3>
        <div class="options" id="tandemGroup"></div>
        <div class="small" id="tandemScoreText">Score: 0</div>
      </div>
    </div>
    <div class="card sticky">
      <div class="scorebox">
        <div class="label">Total SPPB Score</div>
        <div class="total" id="totalScore">0 / 12</div>
      </div>
      <div class="footer"></div>
    </div>
  </div>
</div>
<script>
const sideOptions = [
  {value:1,label:'Held for 10 seconds'},
  {value:0,label:'Held for < 10 seconds'},
  {value:0,label:'Unable to hold'}
];
const semiOptions = [
  {value:1,label:'Held for 10 seconds'},
  {value:0,label:'Held for < 10 seconds'},
  {value:0,label:'Unable to hold'}
];
const tandemOptions = [
  {value:2,label:'Held for 10 seconds'},
  {value:1,label:'Held for 3-9.99 seconds'},
  {value:0,label:'Held for < 3 seconds'},
  {value:0,label:'Unable to hold'}
];
function makeGroup(id, options, initialIndex=0){
  const el = document.getElementById(id);
  let selected = initialIndex;
  el.innerHTML='';
  options.forEach((o,idx)=>{
    const b=document.createElement('button');
    b.className='opt'+(idx===initialIndex?' selected':'');
    b.textContent=o.label+' ('+o.value+')';
    b.onclick=()=>{selected=idx; [...el.querySelectorAll('button')].forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); update();};
    el.appendChild(b);
  });
  return ()=>options[selected].value;
}
function gaitScore(t){
  if(isNaN(t) || t<=0) return 0;
  if(t<4.82) return 4;
  if(t<=6.2) return 3;
  if(t<=8.7) return 2;
  return 1;
}
function chairScore(t){
  if(isNaN(t) || t<=0) return 0;
  if(t<11.2) return 4;
  if(t<=13.69) return 3;
  if(t<=16.69) return 2;
  if(t<=60) return 1;
  return 0;
}
const getSide = makeGroup('sideGroup', sideOptions, 0);
const getSemi = makeGroup('semiGroup', semiOptions, 0);
const getTandem = makeGroup('tandemGroup', tandemOptions, 0);
function update(){
  const g = gaitScore(parseFloat(document.getElementById('gaitTime').value));
  const c = chairScore(parseFloat(document.getElementById('chairTime').value));
  document.getElementById('gaitScoreText').textContent = 'Score: '+g;
  document.getElementById('chairScoreText').textContent = 'Score: '+c;
  document.getElementById('sideScoreText').textContent = 'Score: '+getSide();
  document.getElementById('semiScoreText').textContent = 'Score: '+getSemi();
  document.getElementById('tandemScoreText').textContent = 'Score: '+getTandem();
  document.getElementById('totalScore').textContent = (g+c+getSide()+getSemi()+getTandem())+' / 12';
}
document.getElementById('gaitTime').addEventListener('input', update);
document.getElementById('chairTime').addEventListener('input', update);
update();
</script>
</body>
</html>
